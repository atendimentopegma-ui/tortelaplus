envVarGroups:
  - name: tortelaplus-shared
    envVars:
      - key: PGSSL
        value: require
      - key: TORTELAPLUS_ENV
        value: production-paid
      - key: TORTELAPLUS_REQUIRE_PAID_PROVIDER
        value: true
      - key: TORTELAPLUS_ALLOWED_ORIGINS
        value: https://tortelaplus-app.onrender.com,https://tortelaplus-rede.onrender.com
      - key: TORTELAPLUS_SECRET_KEY
        generateValue: true
      - key: TORTELAPLUS_PROVIDER_TOKEN
        generateValue: true
      - key: TORTELAPLUS_PUBLIC_LINK_SECRET
        generateValue: true
      - key: TORTELAPLUS_CENTRAL_USER
        value: admin
      - key: TORTELAPLUS_CENTRAL_PASSWORD
        generateValue: true
      - key: TORTELAPLUS_BACKUP_DIR
        sync: false

services:
  - type: web
    name: tortelaplus-app
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: tortelaplus-shared
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: TORTELAPLUS_SURFACE
        value: client
  - type: web
    name: tortelaplus-rede
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: tortelaplus-shared
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: TORTELAPLUS_SURFACE
        value: network
